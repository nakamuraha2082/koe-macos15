name: Release DMG

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sync version from git tag to Info.plist
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # タグ名は PlistBuddy のコマンド文にそのまま入るため、vX.Y.Z 以外は受け付けない。
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be vX.Y.Z: ${GITHUB_REF_NAME}"; exit 1; }
          echo "Syncing version: ${VERSION}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion '${VERSION}'" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString '${VERSION}'" Resources/Info.plist

      - name: Build release binary
        run: swift build -c release

      - name: Create app bundle and DMG
        run: ./create-dmg.sh --skip-build

      - name: Get version and changelog
        id: meta
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

          # 前のタグを取得（なければ初回リリースとして全コミットを対象）
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
          else
            RANGE="${GITHUB_REF_NAME}"
          fi

          # feat: と fix: のコミットのみ抽出し、プレフィックスを除去してリスト化
          CHANGELOG=$(git log "$RANGE" --pretty=format:"%s" --no-merges \
            | grep -E "^(feat|fix):" \
            | sed 's/^feat: /- ✨ /' \
            | sed 's/^fix: /- 🐛 /')
          # GITHUB_OUTPUT に複数行を書き込む
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ steps.meta.outputs.changelog }}
        run: |
          cat > notes.md <<NOTES
          ## What's New

          ${CHANGELOG}

          ## インストール方法

          1. \`Koe15-*.dmg\` をダウンロード
          2. DMG を開いて \`Koe15.app\` を \`Applications\` にドラッグ
          3. **初回起動:** ダブルクリック → ブロックされたら「完了」→ **システム設定 > プライバシーとセキュリティ** →「このまま開く」
          4. 権限を許可（マイク・音声認識・アクセシビリティ・入力監視）

          > macOS 15 以上が必要です。録音は1回55秒まで。選択範囲の音声指示による修正は非対応です。
          > アドホック署名のため初回は「このまま開く」操作が必要です。

          ## SHA-256

          \`\`\`
          $(cd dist && shasum -a 256 *.dmg)
          \`\`\`
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "koe! $GITHUB_REF_NAME" --notes-file notes.md
